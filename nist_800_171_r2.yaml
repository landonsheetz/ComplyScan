# NIST SP 800-171 Rev 2 control catalog (representative subset).
#
# Control IDs and requirement intent come from NIST SP 800-171 Rev 2, a U.S.
# Government publication. Point weights (1, 3, 5) follow the DoD Assessment
# Methodology model, where unmet controls subtract their weight from a starting
# score. This file is a curated subset for demonstration, not all 110 controls.
#
# Each control's `check` maps to a path in the system description under
# `configuration:` and states the compliant value.

catalog: NIST SP 800-171 Rev 2 (subset)
starting_note: SPRS methodology subtracts each unmet control's weight.

controls:
  # ---- 3.1 Access Control ----
  - id: "3.1.1"
    family: Access Control
    title: Limit system access to authorized users and processes
    weight: 5
    check: { key: access_control.rbac_enabled, equals: true }
    remediation: Enable role-based access control and remove shared accounts.

  - id: "3.1.2"
    family: Access Control
    title: Limit access to the functions users are permitted to execute
    weight: 5
    check: { key: access_control.least_privilege_enforced, equals: true }
    remediation: Enforce least privilege and review privileged group membership.

  - id: "3.1.5"
    family: Access Control
    title: Employ least privilege for privileged accounts
    weight: 3
    check: { key: access_control.privileged_accounts_reviewed_days, max: 90 }
    remediation: Review privileged accounts at least every 90 days.

  - id: "3.1.12"
    family: Access Control
    title: Monitor and control remote access sessions
    weight: 5
    check: { key: access_control.remote_access_monitored, equals: true }
    remediation: Route remote access through a monitored, logged gateway.

  - id: "3.1.20"
    family: Access Control
    title: Control connections to external systems
    weight: 1
    check: { key: access_control.external_connections_controlled, equals: true }
    remediation: Define and enforce an external connection policy.

  # ---- 3.3 Audit and Accountability ----
  - id: "3.3.1"
    family: Audit and Accountability
    title: Create and retain system audit logs
    weight: 5
    check: { key: audit.logging_enabled, equals: true }
    remediation: Enable centralized logging on in-scope systems.

  - id: "3.3.2"
    family: Audit and Accountability
    title: Ensure actions are traceable to individual users
    weight: 3
    check: { key: audit.user_attribution_enabled, equals: true }
    remediation: Remove shared logins so events map to individuals.

  - id: "3.3.8"
    family: Audit and Accountability
    title: Protect audit information from unauthorized access
    weight: 3
    check: { key: audit.log_retention_days, min: 90 }
    remediation: Retain protected audit logs for at least 90 days.

  # ---- 3.4 Configuration Management ----
  - id: "3.4.1"
    family: Configuration Management
    title: Establish and maintain baseline configurations
    weight: 5
    check: { key: config_mgmt.baseline_documented, equals: true }
    remediation: Document and maintain a hardened baseline configuration.

  - id: "3.4.2"
    family: Configuration Management
    title: Enforce security configuration settings
    weight: 3
    check: { key: config_mgmt.hardening_standard, one_of: ["CIS", "STIG"] }
    remediation: Apply a recognized hardening standard such as CIS or STIG.

  - id: "3.4.6"
    family: Configuration Management
    title: Apply the principle of least functionality
    weight: 3
    check: { key: config_mgmt.unused_services_disabled, equals: true }
    remediation: Disable unnecessary ports, protocols, and services.

  # ---- 3.5 Identification and Authentication ----
  - id: "3.5.3"
    family: Identification and Authentication
    title: Use multifactor authentication for network and privileged access
    weight: 5
    check: { key: identity.mfa_enabled, equals: true }
    remediation: Enforce MFA for all remote and privileged access.

  - id: "3.5.7"
    family: Identification and Authentication
    title: Enforce minimum password complexity
    weight: 1
    check: { key: identity.min_password_length, min: 12 }
    remediation: Require a minimum password length of at least 12.

  - id: "3.5.10"
    family: Identification and Authentication
    title: Store and transmit only cryptographically protected passwords
    weight: 5
    check: { key: identity.password_hashing, one_of: ["bcrypt", "argon2", "pbkdf2"] }
    remediation: Store credentials using an approved salted hashing algorithm.

  # ---- 3.6 Incident Response ----
  - id: "3.6.1"
    family: Incident Response
    title: Establish an operational incident-handling capability
    weight: 5
    check: { key: incident_response.plan_documented, equals: true }
    remediation: Document and socialize an incident response plan.

  - id: "3.6.2"
    family: Incident Response
    title: Track and report incidents to designated officials
    weight: 3
    check: { key: incident_response.reporting_process_defined, equals: true }
    remediation: Define incident reporting timelines and points of contact.

  # ---- 3.11 Risk Assessment ----
  - id: "3.11.2"
    family: Risk Assessment
    title: Scan for vulnerabilities periodically
    weight: 5
    check: { key: risk.vuln_scan_frequency_days, max: 30 }
    remediation: Scan for vulnerabilities at least every 30 days.

  - id: "3.11.3"
    family: Risk Assessment
    title: Remediate vulnerabilities in line with risk assessments
    weight: 1
    check: { key: risk.remediation_sla_defined, equals: true }
    remediation: Define remediation SLAs tied to vulnerability severity.

  # ---- 3.13 System and Communications Protection ----
  - id: "3.13.11"
    family: System and Communications Protection
    title: Use FIPS-validated cryptography to protect CUI
    weight: 5
    check: { key: crypto.fips_validated, equals: true }
    remediation: Use FIPS 140-validated cryptographic modules for CUI.

  - id: "3.13.16"
    family: System and Communications Protection
    title: Protect the confidentiality of CUI at rest
    weight: 1
    check: { key: crypto.encryption_at_rest, equals: true }
    remediation: Encrypt CUI at rest on all in-scope storage.

  # ---- 3.14 System and Information Integrity ----
  - id: "3.14.1"
    family: System and Information Integrity
    title: Identify and correct system flaws promptly
    weight: 5
    check: { key: integrity.patch_management_enabled, equals: true }
    remediation: Establish a patch management process with tracked timelines.

  - id: "3.14.2"
    family: System and Information Integrity
    title: Provide protection from malicious code
    weight: 5
    check: { key: integrity.endpoint_protection, equals: true }
    remediation: Deploy and centrally manage endpoint protection.

  # ---- 3.2 Awareness and Training (policy control, manual) ----
  - id: "3.2.1"
    family: Awareness and Training
    title: Ensure personnel are trained on security risks
    weight: 3
    check: { manual: true }
    remediation: Retain security awareness training records for review.
